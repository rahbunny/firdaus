<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firdaus — The Living Garden</title>
  <!-- Supabase JavaScript SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --emerald-dark: #064e3b;
      --emerald-main: #047857;
      --gold-accent: #f59e0b;
      --gold-light: #fbbf24;
      --cream-bg: #fdfbf7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }

    body {
      background-color: var(--cream-bg);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 2px solid var(--gold-accent);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      min-height: 660px;
      display: flex;
      flex-direction: column;
    }

    /* Animated Carved Wooden Doors Transition */
    .door-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 50;
      display: flex;
      pointer-events: none;
    }

    .door {
      width: 50%; height: 100%;
      background: #3f2314;
      border: 3px solid var(--gold-accent);
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .door-left { transform-origin: left; border-right: 1px solid var(--gold-accent); }
    .door-right { transform-origin: right; border-left: 1px solid var(--gold-accent); }

    .doors-open .door-left { transform: translateX(-100%); }
    .doors-open .door-right { transform: translateX(100%); }

    /* Whiteout Lantern Cutscene Overlay */
    .whiteout-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease-in-out;
    }

    .whiteout-active { opacity: 1; }

    /* Living Garden Canvas & Ascending Lantern */
    #garden-canvas {
      height: 250px;
      background: linear-gradient(to bottom, #064e3b, #047857);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .lantern {
      width: 38px; height: 58px;
      background: radial-gradient(circle, var(--gold-light) 30%, var(--gold-accent) 85%);
      border-radius: 18px 18px 8px 8px;
      box-shadow: 0 0 25px var(--gold-light);
      position: absolute;
      bottom: 20px;
      transition: bottom 1.2s ease-in-out, transform 0.5s ease, filter 0.5s ease;
      animation: float 3s infinite ease-in-out;
      z-index: 10;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Living Foliage SVGs */
    .palm-tree {
      position: absolute;
      bottom: 0;
      width: 65px;
      transition: transform 1s ease-out, opacity 1s ease-out;
      opacity: 0.35;
      transform: scale(0.85);
      z-index: 5;
    }
    .palm-left { left: 8px; }
    .palm-right { right: 8px; transform: scaleX(-1) scale(0.85); }

    .river {
      position: absolute;
      bottom: 0; width: 100%; height: 16px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
      opacity: 0.65;
      animation: flow 4s infinite linear;
      z-index: 2;
    }

    @keyframes flow {
      0% { background-position: 0 0; }
      100% { background-position: 200px 0; }
    }

    /* UI Screens */
    .screen {
      padding: 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .hidden { display: none !important; }

    h1 { color: var(--emerald-dark); font-size: 28px; margin-bottom: 8px; letter-spacing: 1px; }
    h2 { color: var(--emerald-dark); font-size: 20px; margin-bottom: 12px; }
    p { font-size: 15px; color: #4b5563; margin-bottom: 20px; line-height: 1.5; }

    input[type="text"] {
      width: 100%; padding: 12px 16px; margin-bottom: 16px;
      border: 2px solid #d1d5db; border-radius: 8px; font-size: 16px;
      outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--emerald-main); }

    button {
      background: var(--emerald-dark); color: white; border: 1px solid var(--gold-accent);
      padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--emerald-main); }
    button:active { transform: scale(0.98); }

    .score-badge {
      display: inline-block; background: var(--gold-light); color: var(--emerald-dark);
      padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 20px; margin: 0 auto 14px auto;
    }

    .leaderboard-list { text-align: left; margin-top: 15px; background: #f9fafb; border-radius: 8px; padding: 10px; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
    .leaderboard-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Ornate Carved Wooden Doors -->
    <div class="door-overlay" id="doors">
      <div class="door door-left"></div>
      <div class="door door-right"></div>
    </div>

    <!-- Whiteout Cutscene Overlay -->
    <div class="whiteout-overlay" id="whiteout"></div>

    <!-- Living Garden Canvas -->
    <div id="garden-canvas">
      <svg class="palm-tree palm-left" id="palm-l" viewBox="0 0 100 150">
        <path d="M50 150 Q45 100 50 50" stroke="#78350f" stroke-width="8" fill="none"/>
        <path d="M50 50 Q20 30 0 40 M50 50 Q80 30 100 40 M50 50 Q50 10 50 0" stroke="#10b981" stroke-width="6" fill="none"/>
      </svg>
      <div class="lantern" id="lantern"></div>
      <div class="river" id="river"></div>
      <svg class="palm-tree palm-right" id="palm-r" viewBox="0 0 100 150">
        <path d="M50 150 Q45 100 50 50" stroke="#78350f" stroke-width="8" fill="none"/>
        <path d="M50 50 Q20 30 0 40 M50 50 Q80 30 100 40 M50 50 Q50 10 50 0" stroke="#10b981" stroke-width="6" fill="none"/>
      </svg>
    </div>

    <!-- Screen 1: Welcome & Username Entry -->
    <div class="screen" id="screen-welcome">
      <h1>FIRDAUS</h1>
      <p>Enter your username to begin your ascent through the garden.</p>
      <input type="text" id="username-input" placeholder="Enter Username..." />
      <button onclick="startGame()">Begin the Ascent</button>
    </div>

    <!-- Screen 2: Question View -->
    <div class="screen hidden" id="screen-question">
      <h2 id="question-title">Question</h2>
      <p id="question-text">Loading question...</p>
      <input type="text" id="answer-input" placeholder="Type your answer..." />
      <button onclick="submitAnswer()">Submit Answer</button>
    </div>

    <!-- Screen 3: Cutscene & Immediate Score Reveal -->
    <div class="screen hidden" id="screen-score">
      <div class="score-badge" id="score-badge">+0 PTS</div>
      <h2 id="tier-name">Tier Reached</h2>
      <p id="score-feedback">Evaluating answer...</p>
      <button onclick="nextQuestion()">Continue</button>
    </div>

    <!-- Screen 4: Final Leaderboard & Results -->
    <div class="screen hidden" id="screen-results">
      <h1>Ascent Complete!</h1>
      <p>Your Total Score: <strong id="final-score" style="color: var(--gold-accent); font-size: 22px;">0</strong></p>
      <h3 style="color: var(--emerald-dark); margin-top: 10px;">Monthly Leaderboard</h3>
      <div class="leaderboard-list" id="leaderboard-entries">Loading scores...</div>
    </div>
  </div>

  <script>
    // Supabase Configuration — Replace with your Supabase keys from project dashboard
    const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    let sup = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL.includes("supabase.co")) {
      sup = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let username = "";
    let currentQIndex = 0;
    let totalScore = 0;

    // Default Seed Questions & Anchor Scoring Guidelines
    const defaultQuestions = [
      {
        question_number: 1,
        question_text: "Name a GT MSA event.",
        top_answer: "Feed the 404",
        tiers: {
          "feed the 404": 70,
          "sisters only": 60, "brothers only": 60, "sleepover": 60, "fight club": 60,
          "halaqa": 50, "workshop": 50,
          "palestine week": 40, "jummah": 40, "share it night": 40,
          "gingerbread": 30, "playdough": 30, "trivia": 30,
          "picnic": 20, "bbq": 20,
          "alumni dinner": 10, "welcome back dinner": 10, "gala": 10
        }
      },
      {
        question_number: 2,
        question_text: "Name a Sahabi (Companion of the Prophet ﷺ).",
        top_answer: "Al-Arqam ibn Abi Al-Arqam",
        tiers: {
          "al-arqam": 70, "arqam": 70,
          "aisha": 30, "khadija": 30,
          "umar": 20, "uthman": 20, "ali": 20,
          "abu bakr": 10
        }
      }
    ];

    async function startGame() {
      const input = document.getElementById("username-input").value.trim();
      if (!input) return alert("Please enter a username!");
      username = input;

      // Trigger Wooden Doors Opening Animation
      document.getElementById("doors").classList.add("doors-open");

      showScreen("screen-question");
      loadQuestion();
    }

    function loadQuestion() {
      const q = defaultQuestions[currentQIndex];
      document.getElementById("question-title").textContent = `Question ${q.question_number}`;
      document.getElementById("question-text").textContent = q.question_text;
      document.getElementById("answer-input").value = "";
    }

    async function submitAnswer() {
      const answer = document.getElementById("answer-input").value.trim().toLowerCase();
      if (!answer) return alert("Please enter an answer!");

      const q = defaultQuestions[currentQIndex];
      let score = 20; // Default baseline score for unlisted responses

      for (let key in q.tiers) {
        if (answer.includes(key)) {
          score = q.tiers[key];
          break;
        }
      }

      totalScore += score;

      // Persist Submission to Supabase if configured
      if (sup) {
        try {
          await sup.from('player_submissions').insert([{
            username: username,
            edition_name: "November 2026",
            question_number: q.question_number,
            submitted_answer: answer,
            score: score
          }]);
        } catch (e) { console.log("Supabase submission error:", e); }
      }

      // Animate Living Garden & Ascending Lantern
      updateGarden(score);

      // Show Immediate Score Reveal Screen
      document.getElementById("score-badge").textContent = `+${score} PTS`;
      document.getElementById("tier-name").textContent = score === 70 ? "Firdaus Tier!" : `Tier Score: ${score} PTS`;
      document.getElementById("score-feedback").textContent = score === 70
        ? "Exceptional, highly obscure answer! Your lantern reaches the highest terrace."
        : "Your score moves your lantern higher up the garden path.";

      showScreen("screen-score");
    }

    function updateGarden(score) {
      const lantern = document.getElementById("lantern");
      const palmL = document.getElementById("palm-l");
      const palmR = document.getElementById("palm-r");

      // Lantern moves higher up the garden canvas with higher total score
      const maxBottom = 180;
      const calculatedBottom = 20 + (totalScore / 140) * maxBottom;
      lantern.style.bottom = `${Math.min(calculatedBottom, maxBottom)}px`;

      // Foliage scales and grows denser as points accumulate
      const growthScale = 0.85 + (totalScore / 140) * 0.45;
      const opacityVal = 0.35 + (totalScore / 140) * 0.65;

      palmL.style.opacity = opacityVal;
      palmR.style.opacity = opacityVal;
      palmL.style.transform = `scale(${growthScale})`;
      palmR.style.transform = `scaleX(-1) scale(${growthScale})`;
    }

    function nextQuestion() {
      // Trigger Whiteout Cutscene Transition
      const whiteout = document.getElementById("whiteout");
      whiteout.classList.add("whiteout-active");

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < defaultQuestions.length) {
          showScreen("screen-question");
          loadQuestion();
        } else {
          finishGame();
        }
        whiteout.classList.remove("whiteout-active");
      }, 600);
    }

    async function finishGame() {
      document.getElementById("final-score").textContent = totalScore;

      // Record Final Leaderboard Entry in Supabase
      if (sup) {
        try {
          await sup.from('leaderboards').insert([{
            username: username,
            edition_name: "November 2026",
            total_score: totalScore
          }]);
        } catch (e) { console.log("Leaderboard error:", e); }
      }

      showScreen("screen-results");
      loadLeaderboard();
    }

    async function loadLeaderboard() {
      const container = document.getElementById("leaderboard-entries");
      
      if (!sup) {
        container.innerHTML = `
          <div class="leaderboard-item">
            <span><strong>#1</strong> ${username} (You)</span>
            <span style="color: var(--gold-accent); font-weight: bold;">${totalScore} pts</span>
          </div>
        `;
        return;
      }

      try {
        const { data, error } = await sup.from('leaderboards')
          .select('username, total_score')
          .order('total_score', { ascending: false })
          .limit(5);

        if (error || !data || data.length === 0) {
          container.innerHTML = "<p>No entries yet. You are the first!</p>";
          return;
        }

        container.innerHTML = data.map((entry, i) => `
          <div class="leaderboard-item">
            <span><strong>#${i+1}</strong> ${entry.username}</span>
            <span style="color: var(--gold-accent); font-weight: bold;">${entry.total_score} pts</span>
          </div>
        `).join("");
      } catch(e) {
        container.innerHTML = "<p>Unable to load live leaderboard.</p>";
      }
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }
  </script>
</body>
</html>
