<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firdaus — The Living Garden</title>
  <!-- Supabase JavaScript SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --emerald-dark: #064e3b;
      --emerald-main: #047857;
      --emerald-light: #10b981;
      --gold-accent: #f59e0b;
      --gold-light: #fbbf24;
      --cream-bg: #fdfbf7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }

    body {
      background-color: var(--cream-bg);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 490px;
      background: #ffffff;
      border: 2px solid var(--gold-accent);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      min-height: 680px;
      display: flex;
      flex-direction: column;
    }

    /* 1. Carved Wooden Entrance Doors */
    .door-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 50;
      display: flex;
      pointer-events: none;
    }

    .door {
      width: 50%; height: 100%;
      background: repeating-linear-gradient(90deg, #3f2314 0 6px, #522e1b 7px 14px);
      border: 4px solid var(--gold-accent);
      transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .door-left { transform-origin: left; border-right: 2px solid var(--gold-light); }
    .door-right { transform-origin: right; border-left: 2px solid var(--gold-light); }

    .doors-open .door-left { transform: translateX(-100%); }
    .doors-open .door-right { transform: translateX(100%); }

    /* 2. Whiteout Lantern Transition Overlay */
    .whiteout-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #ffffff 20%, #fef3c7 100%);
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
    }

    .whiteout-active { opacity: 1; pointer-events: all; }

    /* 3. Living Garden Canvas & Ascending Lantern */
    #garden-canvas {
      height: 270px;
      background: linear-gradient(to bottom, #042f2e, #064e3b 60%, #047857 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Glowing Ascending Lantern Companion */
    .lantern {
      width: 40px; height: 60px;
      background: radial-gradient(circle, #fffbeb 20%, var(--gold-light) 50%, var(--gold-accent) 90%);
      border-radius: 20px 20px 8px 8px;
      box-shadow: 0 0 30px var(--gold-light), 0 0 60px rgba(251, 191, 36, 0.6);
      position: absolute;
      bottom: 20px;
      transition: bottom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s ease, box-shadow 0.5s ease;
      animation: float 3s infinite ease-in-out;
      z-index: 20;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Trees (Palms and Date Palms) */
    .tree {
      position: absolute;
      bottom: 12px;
      transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: bottom center;
      z-index: 10;
    }

    .palm-left { left: 10px; opacity: 0.4; transform: scale(0.8); }
    .palm-right { right: 10px; opacity: 0.4; transform: scaleX(-1) scale(0.8); }
    
    /* Date Palm Trees (Sprout at Higher Scores) */
    .date-tree-left { left: 75px; opacity: 0; transform: scale(0); }
    .date-tree-right { right: 75px; opacity: 0; transform: scaleX(-1) scale(0); }

    /* Rivers: Water, Milk, and Honey */
    .river-container {
      position: absolute;
      bottom: 0; width: 100%;
      display: flex; flex-direction: column; gap: 3px;
      z-index: 5;
    }

    .river-stream {
      width: 100%; height: 10px;
      transition: all 1s ease;
      opacity: 0;
    }

    .river-water {
      background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
      background-size: 200% 100%;
      animation: riverFlow 3s infinite linear;
      opacity: 0.7;
    }

    .river-milk {
      background: linear-gradient(90deg, #ffffff, #fef3c7, #ffffff);
      background-size: 200% 100%;
      animation: riverFlow 4s infinite linear;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .river-honey {
      background: linear-gradient(90deg, #fbbf24, #d97706, #fbbf24);
      background-size: 200% 100%;
      animation: riverFlow 2.5s infinite linear;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
    }

    @keyframes riverFlow {
      0% { background-position: 0 0; }
      100% { background-position: 200px 0; }
    }

    /* UI Screens */
    .screen {
      padding: 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .hidden { display: none !important; }

    h1 { color: var(--emerald-dark); font-size: 28px; margin-bottom: 6px; letter-spacing: 1px; }
    h2 { color: var(--emerald-dark); font-size: 20px; margin-bottom: 12px; }
    p { font-size: 15px; color: #4b5563; margin-bottom: 20px; line-height: 1.5; }

    input[type="text"] {
      width: 100%; padding: 12px 16px; margin-bottom: 16px;
      border: 2px solid #d1d5db; border-radius: 10px; font-size: 16px;
      outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--emerald-main); }

    button {
      background: var(--emerald-dark); color: white; border: 1px solid var(--gold-accent);
      padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--emerald-main); }
    button:active { transform: scale(0.98); }

    .score-badge {
      display: inline-block; background: var(--gold-light); color: var(--emerald-dark);
      padding: 6px 20px; border-radius: 20px; font-weight: bold; font-size: 22px; margin: 0 auto 12px auto;
    }

    .garden-status-box {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 15px; text-align: left; font-size: 14px; color: #166534;
    }

    .leaderboard-list { text-align: left; margin-top: 12px; background: #f9fafb; border-radius: 10px; padding: 10px; border: 1px solid #e5e7eb; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
    .leaderboard-item:last-child { border-bottom: none; }
    .lush-tag { font-size: 11px; background: #dcfce7; color: #15803d; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Entrance Doors -->
    <div class="door-overlay" id="doors">
      <div class="door door-left"></div>
      <div class="door door-right"></div>
    </div>

    <!-- Whiteout Transition Overlay -->
    <div class="whiteout-overlay" id="whiteout"></div>

    <!-- Living Garden Canvas -->
    <div id="garden-canvas">
      <!-- Base Palm Trees -->
      <svg class="tree palm-left" id="palm-l" width="65" height="130" viewBox="0 0 100 150">
        <path d="M50 150 Q45 100 50 50" stroke="#78350f" stroke-width="8" fill="none"/>
        <path d="M50 50 Q20 30 0 40 M50 50 Q80 30 100 40 M50 50 Q50 10 50 0" stroke="#10b981" stroke-width="6" fill="none"/>
      </svg>
      <svg class="tree palm-right" id="palm-r" width="65" height="130" viewBox="0 0 100 150">
        <path d="M50 150 Q45 100 50 50" stroke="#78350f" stroke-width="8" fill="none"/>
        <path d="M50 50 Q20 30 0 40 M50 50 Q80 30 100 40 M50 50 Q50 10 50 0" stroke="#10b981" stroke-width="6" fill="none"/>
      </svg>

      <!-- Date Palm Trees -->
      <svg class="tree date-tree-left" id="date-l" width="55" height="110" viewBox="0 0 100 150">
        <path d="M50 150 Q40 90 50 40" stroke="#582f0e" stroke-width="9" fill="none"/>
        <path d="M50 40 Q15 20 -5 30 M50 40 Q85 20 105 30 M50 40 Q50 0 50 -10" stroke="#059669" stroke-width="7" fill="none"/>
        <circle cx="42" cy="45" r="5" fill="#fbbf24"/>
        <circle cx="58" cy="45" r="5" fill="#f59e0b"/>
      </svg>
      <svg class="tree date-tree-right" id="date-r" width="55" height="110" viewBox="0 0 100 150">
        <path d="M50 150 Q40 90 50 40" stroke="#582f0e" stroke-width="9" fill="none"/>
        <path d="M50 40 Q15 20 -5 30 M50 40 Q85 20 105 30 M50 40 Q50 0 50 -10" stroke="#059669" stroke-width="7" fill="none"/>
        <circle cx="42" cy="45" r="5" fill="#fbbf24"/>
        <circle cx="58" cy="45" r="5" fill="#f59e0b"/>
      </svg>

      <!-- Ascending Lantern Companion -->
      <div class="lantern" id="lantern"></div>

      <!-- Rivers: Water, Milk, and Honey -->
      <div class="river-container">
        <div class="river-stream river-honey" id="river-honey"></div>
        <div class="river-stream river-milk" id="river-milk"></div>
        <div class="river-stream river-water" id="river-water"></div>
      </div>
    </div>

    <!-- Screen 1: Welcome -->
    <div class="screen" id="screen-welcome">
      <h1>FIRDAUS</h1>
      <p>Cultivate your garden through knowledge and discovery.</p>
      <input type="text" id="username-input" placeholder="Enter Username..." />
      <button onclick="startGame()">Begin the Ascent</button>
    </div>

    <!-- Screen 2: Question -->
    <div class="screen hidden" id="screen-question">
      <h2 id="question-title">Question</h2>
      <p id="question-text">Loading question...</p>
      <input type="text" id="answer-input" placeholder="Type your answer..." />
      <button onclick="submitAnswer()">Submit Answer</button>
    </div>

    <!-- Screen 3: Score Cutscene -->
    <div class="screen hidden" id="screen-score">
      <div class="score-badge" id="score-badge">+0 PTS</div>
      <h2 id="tier-name">Tier Reached</h2>
      <p id="score-feedback">Evaluating answer...</p>
      <button onclick="triggerWhiteoutCutscene()">Continue</button>
    </div>

    <!-- Screen 4: Leaderboard & Garden Showcase -->
    <div class="screen hidden" id="screen-results">
      <h1>Ascent Complete!</h1>
      <p>Your Total Score: <strong id="final-score" style="color: var(--gold-accent); font-size: 22px;">0</strong></p>
      
      <div class="garden-status-box" id="garden-summary-box">
        🌿 <strong>Garden Unlocked:</strong> Loading summary...
      </div>

      <button onclick="shareGardenResults()">Share My Garden 🌿</button>
      
      <h3 style="color: var(--emerald-dark); margin-top: 16px;">Monthly Leaderboard</h3>
      <div class="leaderboard-list" id="leaderboard-entries">Loading scores...</div>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    let sup = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL.includes("supabase.co")) {
      sup = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let username = "";
    let currentQIndex = 0;
    let totalScore = 0;

    const defaultQuestions = [
      {
        question_number: 1,
        question_text: "Name a GT MSA event.",
        top_answer: "Feed the 404",
        tiers: {
          "feed the 404": 70,
          "sisters only": 60, "brothers only": 60, "sleepover": 60, "fight club": 60,
          "halaqa": 50, "workshop": 50,
          "palestine week": 40, "jummah": 40, "share it night": 40,
          "gingerbread": 30, "playdough": 30, "trivia": 30,
          "picnic": 20, "bbq": 20,
          "alumni dinner": 10, "welcome back dinner": 10, "gala": 10
        }
      },
      {
        question_number: 2,
        question_text: "Name a Sahabi (Companion of the Prophet ﷺ).",
        top_answer: "Al-Arqam ibn Abi Al-Arqam",
        tiers: {
          "al-arqam": 70, "arqam": 70,
          "aisha": 30, "khadija": 30,
          "umar": 20, "uthman": 20, "ali": 20,
          "abu bakr": 10
        }
      }
    ];

    async function startGame() {
      const input = document.getElementById("username-input").value.trim();
      if (!input) return alert("Please enter a username!");
      username = input;

      document.getElementById("doors").classList.add("doors-open");

      showScreen("screen-question");
      loadQuestion();
    }

    function loadQuestion() {
      const q = defaultQuestions[currentQIndex];
      document.getElementById("question-title").textContent = `Question ${q.question_number}`;
      document.getElementById("question-text").textContent = q.question_text;
      document.getElementById("answer-input").value = "";
    }

    async function submitAnswer() {
      const answer = document.getElementById("answer-input").value.trim().toLowerCase();
      if (!answer) return alert("Please enter an answer!");

      const q = defaultQuestions[currentQIndex];
      let score = 20;

      for (let key in q.tiers) {
        if (answer.includes(key)) {
          score = q.tiers[key];
          break;
        }
      }

      totalScore += score;

      if (sup) {
        try {
          await sup.from('player_submissions').insert([{
            username: username,
            edition_name: "November 2026",
            question_number: q.question_number,
            submitted_answer: answer,
            score: score
          }]);
        } catch (e) { console.log("Supabase error:", e); }
      }

      updateGardenGraphics();

      document.getElementById("score-badge").textContent = `+${score} PTS`;
      document.getElementById("tier-name").textContent = score === 70 ? "Firdaus Tier!" : `Tier Score: ${score} PTS`;
      document.getElementById("score-feedback").textContent = score === 70
        ? "Exceptional, highly obscure answer! Your lantern reaches the highest terrace."
        : "Your score moves your lantern higher up the garden path.";

      showScreen("screen-score");
    }

    function updateGardenGraphics() {
      const lantern = document.getElementById("lantern");
      const palmL = document.getElementById("palm-l");
      const palmR = document.getElementById("palm-r");
      const dateL = document.getElementById("date-l");
      const dateR = document.getElementById("date-r");

      const riverWater = document.getElementById("river-water");
      const riverMilk = document.getElementById("river-milk");
      const riverHoney = document.getElementById("river-honey");

      const maxAscent = 180;
      const progressRatio = Math.min(totalScore / 140, 1.0);
      lantern.style.bottom = `${20 + progressRatio * maxAscent}px`;

      const palmScale = 0.8 + (progressRatio * 0.5);
      const palmOpacity = 0.4 + (progressRatio * 0.6);
      palmL.style.transform = `scale(${palmScale})`;
      palmR.style.transform = `scaleX(-1) scale(${palmScale})`;
      palmL.style.opacity = palmOpacity;
      palmR.style.opacity = palmOpacity;

      if (totalScore >= 40) {
        const dateScale = Math.min((totalScore - 30) / 70, 1.0);
        dateL.style.transform = `scale(${dateScale})`;
        dateR.style.transform = `scaleX(-1) scale(${dateScale})`;
        dateL.style.opacity = 1.0;
        dateR.style.opacity = 1.0;
      }

      riverWater.style.opacity = 0.8;
      
      if (totalScore >= 50) {
        riverMilk.style.opacity = 0.85;
      }
      
      if (totalScore >= 90) {
        riverHoney.style.opacity = 0.9;
      }
    }

    function triggerWhiteoutCutscene() {
      const whiteout = document.getElementById("whiteout");
      const lantern = document.getElementById("lantern");

      lantern.style.boxShadow = "0 0 60px #ffffff, 0 0 100px #fbbf24";
      whiteout.classList.add("whiteout-active");

      setTimeout(() => {
        currentQIndex++;
        if (currentQIndex < defaultQuestions.length) {
          showScreen("screen-question");
          loadQuestion();
        } else {
          finishGame();
        }
        whiteout.classList.remove("whiteout-active");
        lantern.style.boxShadow = "0 0 30px var(--gold-light), 0 0 60px rgba(251, 191, 36, 0.6)";
      }, 550);
    }

    async function finishGame() {
      document.getElementById("final-score").textContent = totalScore;

      let riversUnlocked = ["Water"];
      if (totalScore >= 50) riversUnlocked.push("Milk");
      if (totalScore >= 90) riversUnlocked.push("Honey");

      let gardenTier = "Oasis Entrance";
      if (totalScore >= 120) gardenTier = "Paradise Firdaus 🌟";
      else if (totalScore >= 80) gardenTier = "Lush Courtyard 🌴";
      else if (totalScore >= 40) gardenTier = "Date Palm Garden 🌴";

      document.getElementById("garden-summary-box").innerHTML = `
        🌿 <strong>Garden Tier:</strong> ${gardenTier}<br/>
        🌊 <strong>Celestial Rivers Unlocked:</strong> ${riversUnlocked.join(", ")}<br/>
        🌴 <strong>Foliage Density:</strong> ${Math.min(Math.round((totalScore/140)*100), 100)}%
      `;

      if (sup) {
        try {
          await sup.from('leaderboards').insert([{
            username: username,
            edition_name: "November 2026",
            total_score: totalScore
          }]);
        } catch (e) { console.log("Leaderboard error:", e); }
      }

      showScreen("screen-results");
      loadLeaderboard();
    }

    function shareGardenResults() {
      const shareText = `Firdaus Ascent 🌿✨\nPlayer: ${username}\nScore: ${totalScore} PTS\nRivers Unlocked: ${totalScore >= 90 ? 'Water, Milk & Honey 🍯' : totalScore >= 50 ? 'Water & Milk 🥛' : 'Water 🌊'}\nPlay this month's edition: [suspicious link removed]`;
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText);
        alert("Garden results copied to clipboard! Share it in your Substack comments or social media 🌿");
      } else {
        alert(shareText);
      }
    }

    async function loadLeaderboard() {
      const container = document.getElementById("leaderboard-entries");
      
      if (!sup) {
        container.innerHTML = `
          <div class="leaderboard-item">
            <span><strong>#1</strong> ${username} <span class="lush-tag">Lush Garden</span></span>
            <span style="color: var(--gold-accent); font-weight: bold;">${totalScore} pts</span>
          </div>
        `;
        return;
      }

      try {
        const { data, error } = await sup.from('leaderboards')
          .select('username, total_score')
          .order('total_score', { ascending: false })
          .limit(5);

        if (error || !data || data.length === 0) {
          container.innerHTML = "<p>No entries yet. You are the first!</p>";
          return;
        }

        container.innerHTML = data.map((entry, i) => `
          <div class="leaderboard-item">
            <span><strong>#${i+1}</strong> ${entry.username} <span class="lush-tag">${entry.total_score >= 100 ? 'Firdaus' : 'Lush'}</span></span>
            <span style="color: var(--gold-accent); font-weight: bold;">${entry.total_score} pts</span>
          </div>
        `).join("");
      } catch(e) {
        container.innerHTML = "<p>Unable to load live leaderboard.</p>";
      }
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }
  </script>
</body>
</html>
